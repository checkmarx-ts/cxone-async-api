name: CI Build Steps [called]
on:
  push:

jobs:
  call-unit-tests-coverage:
    uses: ./.github/workflows/coverage.yml
    secrets:
      TEST_TENANT_ID: ${{ vars.TEST_TENANT_ID }}
      TEST_REGION: ${{ vars.TEST_REGION }}
      TEST_OAUTH_CLIENT_SECRET: ${{ secrets.TEST_OAUTH_CLIENT_SECRET }}
      TEST_OAUTH_CLIENT_ID: ${{ secrets.TEST_OAUTH_CLIENT_ID }}
      TEST_API_KEY: ${{ secrets.TEST_API_KEY }}

  execute-pylint:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      matrix:
        pver:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    container: python:${{ matrix.pver }}
    steps:
      - name: Fetch Code
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b

      - name: Make virtual environment
        shell: bash
        run: |
          pip install virtualenv
          virtualenv .venv
          . .venv/bin/activate
          
          pip install . pylint

      - name: Install packages
        shell: bash
        run: |
          pip install . pylint
  

      - name: Pylint
        shell: bash
        run: |
          pylint --disable=all --enable=E,F --disable=E1121 --score=false cxone_api


  call-package-build:
    uses: ./.github/workflows/build.yml
    with:
      buildonly: true

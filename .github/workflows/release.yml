name: Publish a Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version tag to use in the form of x.x.x"
        required: true
        type: string
      prerelease:
        description: "Check if this is to publish a pre-release."
        required: true
        type: boolean
      skiputs:
        description: "Check to skip unit test execution (not advised)."
        required: true
        type: boolean

permissions:
  contents: read

jobs:

  tag-repo:
    runs-on: cx-public-ubuntu-x64
    outputs:
      tag: ${{ steps.tag-string.outputs.tag }}
      release_version: ${{ steps.tag-string.outputs.release_version }}
    permissions:
      contents: write
    steps:
      - name: Create tag
        id: tag-string
        run: |

          [ ${{ inputs.prerelease }} = false ] && echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT || \
            echo "tag=${{ inputs.version }}rc$GITHUB_RUN_NUMBER" >> $GITHUB_OUTPUT

          echo "release_version=${{ inputs.version }}" >> $GITHUB_OUTPUT

      - name: Validate no tag
        run: |
          set +e
          git clone --branch ${{ steps.tag-string.outputs.tag }} --depth=1 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY > /dev/null 2>&1 && exit 1
          set -e

      - name: Fetch Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set Tag
        run: |
          git config --global user.email "${{ github.triggering_actor }}"
          git config --global user.name "${{ github.triggering_actor }}"
          git tag '${{ steps.tag-string.outputs.tag }}'
          git push origin '${{ steps.tag-string.outputs.tag }}'


  call-unit-tests-coverage:
    uses: ./.github/workflows/coverage.yml
    secrets: inherit
    needs: [tag-repo]
    with:
      skip: ${{ inputs.skiputs }}
      tag: ${{ needs.tag-repo.outputs.tag }}
  

  build-api-docs:
    uses: ./.github/workflows/build-api-docs.yml
    needs: [tag-repo]
    secrets: inherit
    with:
      tag: ${{ needs.tag-repo.outputs.tag }}

  build-wheel:
    uses: ./.github/workflows/build-wheel.yml
    needs: [tag-repo]
    secrets: inherit
    with:
      tag: ${{ needs.tag-repo.outputs.tag }}

  publish-release:
    permissions:
      contents: write
    runs-on: cx-public-ubuntu-x64
    needs: [build-wheel, build-api-docs, call-unit-tests-coverage, tag-repo]
    steps:
      - name: Fetch Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.tag-repo.outputs.tag }}

      - name: Download apidoc pdf artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: apidoc-pdf-${{ github.run_number }}
          path: ./dist

      - name: Download apidoc skill artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: apidoc-skill-${{ github.run_number }}
          path: ./dist

      - name: Download wheel artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheel-${{ github.run_number }}
          path: ./dist

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Make release text
        run: |
          echo "# Checkmarx One Async API ${{ needs.tag-repo.outputs.tag }}" > release.md

          python3 ./.github/workflows/scripts/json2md.py ./release-notes.json ${{ needs.tag-repo.outputs.release_version }} >> release.md

          echo '' >> release.md
          echo '' >> release.md
          echo '## Installation' >> release.md
          WHEEL_NAME=$(basename $(ls dist/*.whl))
          WHEEL_HASH=$(pip hash dist/$WHEEL_NAME | grep "^--")
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ needs.tag-repo.outputs.tag }}/$WHEEL_NAME"

          echo 'You can install the package from PyPI by adding the following line to your `requirements.txt` file:' >> release.md
          echo '```' >> release.md
          echo cxone-async-api==${{ needs.tag-repo.outputs.tag }} >> release.md
          echo '```' >> release.md

          echo 'You can also install the package directly from the Github release by adding the following line to your `requirements.txt` file:' >> release.md
          echo '```' >> release.md
          echo $RELEASE_URL >> release.md
          echo '```' >> release.md

          echo "## Hashes" >> release.md
          echo "### $WHEEL_NAME" >> release.md
          echo '```' >> release.md
          echo "$WHEEL_HASH" >> release.md
          echo '```' >> release.md


      - name: Create GitHub release
        id: create_release
        uses: step-security/release-action@a0d8e0f90f554c15366ca2c9046bf4090d24adbe # v1.21.0
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: ./dist/*.whl,./dist/*.pdf,./dist/*.zip
          bodyFile: release.md
          name: ${{ needs.tag-repo.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          tag: ${{ needs.tag-repo.outputs.tag }}

  publish-pypi:
    runs-on: cx-public-ubuntu-x64
    needs: [publish-release, tag-repo]
    permissions:
      id-token: write
    steps:

      - name: Download wheel artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheel-${{ github.run_number }}
          path: ./dist

      - name: PyPI Publish
        uses: step-security/gh-action-pypi-publish@ef63b3f651e4131083ceb916595ce721a1959385 # v1.14.0
        with:
          verbose: true


  artifact-cleanup:
    runs-on: cx-public-ubuntu-x64
    needs: 
      - publish-pypi
      - publish-release
      - build-api-docs
      - build-wheel
    if: always() && ( needs.build-api-docs.result == 'success' || needs.build-wheel.result == 'success' )
    steps:
      - uses: step-security/delete-artifact@9a5b2d6793eb97cf052deddb87cd073aabb77385 # v6.0.0
        with:
          name: |
            apidoc-pdf-${{ github.run_number }}
            apidoc-skill-${{ github.run_number }}
            wheel-${{ github.run_number }}

  remove-tag-on-failure:
    needs: [publish-pypi, tag-repo]
    runs-on: cx-public-ubuntu-x64
    permissions:
      contents: write
    if:  (failure() || cancelled()) && needs.tag-repo.result == 'success'
    steps:
      - name: Fetch Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Remove CodeTag
        run: git push origin ':refs/tags/${{ needs.tag-repo.outputs.tag }}'

  remove-release-on-failure:
    needs: [publish-release, publish-pypi, tag-repo]
    runs-on: cx-public-ubuntu-x64
    permissions:
      contents: write
    if:  (failure() || cancelled()) && needs.tag-repo.result == 'success' && needs.publish-release.result == 'success'
    steps:
      - name: Remove Release
        run: gh release delete ${{ needs.tag-repo.outputs.tag }} --yes

name: Build Steps [called]
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      prerelease:
        type: boolean
        default: false
      release_version:
        type: string
        default: ''
      buildonly:
        type: boolean
        default: false

jobs:
  build-api-docs:
    runs-on: ubuntu-latest
    container: sphinxdoc/sphinx-latexpdf:8.2.3
    steps:
      - name: Fetch Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.version }}

      - name: Build PDF
        run: |
          echo "__version__='${{ inputs.version }}'" > cxone_api/__version__.py
          pip install sphinx-autoapi .
          PYTHONPATH=$(pwd) sphinx-build -M latexpdf -c docs . docs_build && : || :
          make -C docs_build
          mv docs_build/cxone-async-api.pdf docs_build/cxone-async-api-${{ inputs.version }}.pdf

      - name: Upload apidoc pdf artifact
        if: ${{ ! inputs.buildonly }}
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b
        with:
          name: apidoc-pdf-${{ github.run_number }}
          path: docs_build/*.pdf          

  create-release:
    needs: [build-api-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.version }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          echo "__version__='${{ inputs.version }}'" > cxone_api/__version__.py
          pip3 install build
          python3 -m build

      - name: Make release text
        if: ${{ ! inputs.buildonly }} 
        run: |
          echo "# Checkmarx One Async API ${{ inputs.version }}" > release.md

          python3 ./.github/workflows/scripts/json2md.py ./release-notes.json ${{ inputs.release_version }} >> release.md

          echo '\n\n## Installation' >> release.md
          echo 'Installation can be performed by adding one of the following lines to your `requirements.txt` file:' >> release.md
          WHEEL_NAME=$(basename $(ls dist/*.whl))
          WHEEL_HASH=$(pip3 hash dist/$WHEEL_NAME | grep "^--")
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/$WHEEL_NAME"

          echo '```' >> release.md
          echo $RELEASE_URL >> release.md
          echo '```' >> release.md

          echo '```' >> release.md
          echo "git+https://github.com/${{ github.repository }}.git@${{ inputs.version }}" >> release.md
          echo '```' >> release.md

          echo "## Hashes" >> release.md
          echo "### $WHEEL_NAME" >> release.md
          echo '```' >> release.md
          echo "$WHEEL_HASH" >> release.md
          echo '```' >> release.md

      - name: Download apidoc pdf artifact
        if: ${{ ! inputs.buildonly }}
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: apidoc-pdf-${{ github.run_number }}

      - name: Create GitHub release
        if: ${{ ! inputs.buildonly }}
        id: create_release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: ./dist/*.whl, *.pdf
          bodyFile: release.md
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          tag: ${{ inputs.version }}

  artifact-cleanup:
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
      - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: |
            apidoc-pdf-${{ github.run_number }}

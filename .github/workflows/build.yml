name: Build Steps [called]
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      prerelease:
        type: boolean
        default: false
      release_version:
        type: string
        default: ''
      buildonly:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-api-docs:
    uses: ./.github/workflows/build-api-docs.yml
    with:
      version: ${{ inputs.version }}

  build-package:
    uses: ./.github/workflows/build-wheel.yml
    with:
      version: ${{ inputs.version }}

  create-release:
    needs: [build-api-docs, build-package]
    runs-on: cx-public-ubuntu-x64
    permissions:
      contents: write
    steps:
      - name: Download apidoc pdf artifact
        if: ${{ ! inputs.buildonly }}
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: apidoc-pdf-${{ github.run_number }}

      - name: Download wheel artifact
        if: ${{ ! inputs.buildonly }}
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: wheel-${{ github.run_number }}

      - name: Fetch Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.version }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Make release text
        if: ${{ ! inputs.buildonly }} 
        run: |
          echo "# Checkmarx One Async API ${{ inputs.version }}" > release.md

          python3 ./.github/workflows/scripts/json2md.py ./release-notes.json ${{ inputs.release_version }} >> release.md

          echo '\n\n## Installation' >> release.md
          echo 'Installation can be performed by adding one of the following lines to your `requirements.txt` file:' >> release.md
          WHEEL_NAME=$(basename $(ls dist/*.whl))
          WHEEL_HASH=$(pip3 hash dist/$WHEEL_NAME | grep "^--")
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/$WHEEL_NAME"

          echo '```' >> release.md
          echo $RELEASE_URL >> release.md
          echo '```' >> release.md

          echo '```' >> release.md
          echo "git+https://github.com/${{ github.repository }}.git@${{ inputs.version }}" >> release.md
          echo '```' >> release.md

          echo "## Hashes" >> release.md
          echo "### $WHEEL_NAME" >> release.md
          echo '```' >> release.md
          echo "$WHEEL_HASH" >> release.md
          echo '```' >> release.md


      - name: Create GitHub release
        if: ${{ ! inputs.buildonly }}
        id: create_release
        uses: step-security/release-action@a0d8e0f90f554c15366ca2c9046bf4090d24adbe # v1.21.0
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: *.whl, *.pdf
          bodyFile: release.md
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          tag: ${{ inputs.version }}

  artifact-cleanup:
    runs-on: cx-public-ubuntu-x64
    needs: [create-release]
    steps:
      - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118
        with:
          name: |
            apidoc-pdf-${{ github.run_number }}
            wheel-${{ github.run_number }}
